<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Site Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gradient-bg: linear-gradient(135deg,#667eea 0%,#764ba2 100%); 
            --gradient-bg-dark: linear-gradient(135deg,#0f0f23 0%,#1a1a2e 50%,#16213e 100%);
        }
        
        * { font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--gradient-bg); 
            min-height:100vh; 
            animation: fadeIn 0.8s ease-in;
        }
        
        .glass-card { 
            background: rgba(255,255,255,0.95); 
            backdrop-filter: blur(20px) saturate(1.4); 
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        
        .error-icon {
            animation: pulse 2s infinite;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
            transform: translateY(0);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.3);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @media (prefers-color-scheme: dark) { 
            body { background: var(--gradient-bg-dark); } 
            .glass-card { 
                background: rgba(15,15,35,0.85); 
                color:#f1f5f9; 
                border-color: rgba(255,255,255,0.1);
            } 
        }
        
        @media print { 
            body { background:#fff; } 
            .glass-card { background:#fff!important; box-shadow:none!important; border:1px solid #e5e7eb; } 
        }
    </style>
</head>
<body class="flex items-center justify-center p-5 relative overflow-hidden">
    <!-- Background Animation -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-white opacity-10 rounded-full blur-xl animate-pulse"></div>
        <div class="absolute top-1/2 -right-10 w-60 h-60 bg-purple-300 opacity-20 rounded-full blur-2xl animate-pulse" style="animation-delay: 1s;"></div>
        <div class="absolute -bottom-10 left-1/3 w-32 h-32 bg-indigo-300 opacity-15 rounded-full blur-xl animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <div class="max-w-lg w-full glass-card rounded-2xl shadow-2xl p-8 md:p-12 text-center border relative z-10">
        <div class="error-icon text-6xl md:text-7xl text-red-400 mb-6">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        
        <h1 class="text-2xl md:text-3xl font-bold text-indigo-900 mb-4 tracking-tight">
            Oops! Something went wrong
        </h1>
        
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
            <p class="text-red-800 text-sm leading-relaxed font-medium">{{ error }}</p>
        </div>
        
        <div class="space-y-4 mb-8">
            <p class="text-slate-600 text-sm">
                <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>
                This error has been logged and we're working to fix it.
            </p>
            <p class="text-slate-500 text-xs">
                If this problem persists, please contact support with the error details above.
            </p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="btn-primary text-white px-6 py-3 rounded-lg flex items-center justify-center space-x-2 shadow-lg hover:shadow-xl">
                <i class="fas fa-home"></i>
                <span>Back to Dashboard</span>
            </a>
            
            <button onclick="window.history.back()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg transition-all duration-200 flex items-center justify-center space-x-2 border border-gray-300">
                <i class="fas fa-arrow-left"></i>
                <span>Go Back</span>
            </button>
        </div>
        
        <div class="mt-8 pt-6 border-t border-gray-200">
            <button onclick="location.reload()" class="text-indigo-600 hover:text-indigo-800 text-sm transition-colors duration-200">
                <i class="fas fa-redo mr-1"></i>
                Try refreshing the page
            </button>
        </div>
    </div>

    <script>
        // Auto-reload functionality (optional)
        let reloadTimer;
        
        function startAutoReload() {
            reloadTimer = setTimeout(() => {
                if (confirm('Would you like to automatically refresh and try again?')) {
                    location.reload();
                }
            }, 10000); // 10 seconds
        }
        
        // Clear timer if user interacts
        document.addEventListener('click', () => {
            if (reloadTimer) {
                clearTimeout(reloadTimer);
            }
        });
        
        // Start auto-reload timer
        startAutoReload();
        
        // Add some interactive feedback
        document.querySelector('.error-icon').addEventListener('click', function() {
            this.style.animation = 'none';
            setTimeout(() => {
                this.style.animation = 'pulse 2s infinite';
            }, 100);
        });
    </script>
</body>
</html>
